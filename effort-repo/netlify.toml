[build]
  publish = "public"
  functions = "netlify/functions"
  # Gate every deploy on engine behavior, the calibration benchmark, the real
  # DOM boot flow, and the committed data-integrity reports. The full suite is
  # still quick enough for every push and catches failures outside engine.js.
  command = "npm run check"

[build.environment]
  NODE_VERSION = "22"

# The service worker must never be cached by the CDN. If it is, returning
# visitors keep the old worker and never find out there is a new build.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
